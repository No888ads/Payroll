<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Payroll & Notice Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        /* Top Navigation Tabs - 4 Column Layout */
        .tabs {
            display: flex;
            background-color: #e9ecef;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 2px;
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: #007bff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Page Content Logic */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        h2 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
            outline: none;
        }

        /* Radio Toggle Styling */
        .radio-toggle {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
        }

        .radio-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Dynamic Row Styling for OT */
        .ot-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        .ot-row input { width: 100%; padding: 10px; }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .btn-add:hover { background-color: #218838; }

        .btn-remove {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Modern Result Section */
        .result-section {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result-amount { font-size: 26px; font-weight: bold; }

        /* ================= VISUAL CALENDAR STYLING ================= */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }

        .calendar-header h3 { font-size: 16px; color: #1e293b; }
        .calendar-nav-btn {
            background: #007bff; color: white; border: none; padding: 5px 12px;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background-color: #cbd5e1;
            padding: 4px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .calendar-day-name {
            background-color: #e2e8f0;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 0;
            color: #475569;
            text-transform: uppercase;
        }

        .calendar-cell {
            background-color: #ffffff;
            min-height: 95px;
            padding: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        .calendar-cell.today { background-color: #eff6ff; border: 2px solid #3b82f6; }
        .calendar-cell.other-month { background-color: #f8fafc; color: #94a3b8; }
        .cell-number { font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 4px; }

        .calendar-event-tag {
            background-color: #3b82f6;
            color: white;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 3px;
            margin-bottom: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.2;
        }

        .calendar-event-tag.triggered { background-color: #10b981; } /* Turns green when Bot blast is sent */

        .event-delete-x {
            font-size: 9px; margin-left: 3px; background: rgba(0,0,0,0.2); 
            border-radius: 50%; width: 11px; height: 11px; display: inline-flex;
            align-items: center; justify-content: center; color: white; border: none;
            cursor: pointer;
        }

        /* Signature Footer Styling */
        .app-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 700;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('otPage', this)">OT & PH Claim</button>
        <button class="tab-btn" onclick="switchTab('resignPage', this)">Resignation</button>
        <button class="tab-btn" onclick="switchTab('absentPage', this)">Absent Deduct</button>
        <button class="tab-btn" onclick="switchTab('calendarPage', this)">HR Calendar</button>
    </div>

    <div id="otPage" class="page active">
        <h2>OT & Public Holiday Claims</h2>
        <div class="radio-toggle">
            <label class="radio-label"><input type="radio" name="claimMode" value="minutesOt" checked onchange="toggleClaimMode()"> Overtime (Minutes Tracker - 1.5x)</label>
            <label class="radio-label"><input type="radio" name="claimMode" value="negativeOt" onchange="toggleClaimMode()"> Negative OT (Minutes Tracker - 1.0x)</label>
            <label class="radio-label"><input type="radio" name="claimMode" value="phDoublePay" onchange="toggleClaimMode()"> Public Holiday (Double Pay - 2.0x)</label>
        </div>
        <div class="input-group">
            <label for="basicSalary">Basic Monthly Salary (RM)</label>
            <input type="number" id="basicSalary" placeholder="e.g., 2500" min="0">
        </div>
        <div id="otMinutesInputGroup">
            <div class="input-group">
                <label id="minutesGroupLabel">Overtime Duration (Minutes Per Day)</label>
                <div id="otRowsContainer">
                    <div class="ot-row">
                        <input type="number" class="ot-minutes" placeholder="Enter minutes & press Enter" min="0" onkeydown="checkEnter(event)">
                        <button class="btn-remove" onclick="removeRow(this)">X</button>
                    </div>
                </div>
            </div>
            <button class="btn-add" onclick="addRow()">+ Add Day</button>
        </div>
        <div id="phDaysInputGroup" style="display: none;">
            <div class="input-group">
                <label for="phDaysWorked">Number of Public Holidays Worked</label>
                <input type="number" id="phDaysWorked" placeholder="e.g., 1" min="1">
            </div>
        </div>
        <button class="btn-calc" onclick="calculateClaim()">Calculate Amount</button>
        <div class="result-section" id="otResultSection">
            <div class="total-hours-text" id="claimSummaryText" style="font-size: 13px; color: #4b5563; margin-bottom: 8px;">Total Breakdown</div>
            <h3 style="font-size: 14px; margin-bottom: 6px; text-transform: uppercase;" id="claimResultTitle">Estimated Amount</h3>
            <p class="result-amount" id="totalOt">RM 0.00</p>
        </div>
    </div>

    <div id="resignPage" class="page">
        <h2>Notice, Indemnity & Leave Encashment</h2>
        <div class="radio-toggle">
            <label class="radio-label"><input type="radio" name="resignMode" value="findEnd" checked onchange="toggleResignMode()"> Find Last Working Day</label>
            <label class="radio-label"><input type="radio" name="resignMode" value="findDiff" onchange="toggleResignMode()"> Calculate Notice Served</label>
            <label class="radio-label"><input type="radio" name="resignMode" value="shortNotice" onchange="toggleResignMode()"> Short Notice Indemnity</label>
            <label class="radio-label"><input type="radio" name="resignMode" value="ytdRefund" onchange="toggleResignMode()"> Refund YTD AL</label>
        </div>
        <div id="standardNoticeDatesGroup"><div class="input-group"><label for="submissionDate">Letter Submission Date</label><input type="date" id="submissionDate"></div></div>
        <div id="noticeDurationGroup"><div class="input-group" style="display: flex; gap: 10px;"><div style="flex: 2;"><label for="noticeValue">Notice Period Duration</label><input type="number" id="noticeValue" placeholder="e.g., 30" min="1"></div><div style="flex: 1.5;"><label for="noticeUnit">Unit</label><select id="noticeUnit"><option value="days">Days</option><option value="months">Months</option></select></div></div></div>
        <div id="lastDayTargetGroup" style="display: none;"><div class="input-group"><label for="targetLastDay">Proposed Last Working Day</label><input type="date" id="targetLastDay"></div></div>
        <div id="shortNoticeGroup" style="display: none;"><div class="input-group"><label for="shortNoticeSalary">Basic Monthly Salary (RM)</label><input type="number" id="shortNoticeSalary" placeholder="e.g., 3000" min="0"></div><div class="input-group"><label for="shortNoticeDays">Number of Short Notice Days</label><input type="number" id="shortNoticeDays" placeholder="e.g., 5" min="1"></div></div>
        <div id="ytdRefundGroup" style="display: none;"><div class="input-group"><label for="ytdSalary">Basic Monthly Salary (RM)</label><input type="number" id="ytdSalary" placeholder="e.g., 2500" min="0"></div><div class="input-group"><label for="ytdDays">Balance YTD Annual Leave</label><input type="number" id="ytdDays" placeholder="e.g., 4.5" min="0.5" step="0.5"></div></div>
        <button class="btn-calc" onclick="calculateNotice()">Calculate Amount</button>
        <div class="result-section" id="resignResultSection">
            <h3 style="font-size: 14px; margin-bottom: 6px; text-transform: uppercase;" id="resignResultTitle">Calculated Result</h3>
            <p class="result-amount" style="font-size: 22px;" id="resignResultValue">-</p>
        </div>
    </div>

    <div id="absentPage" class="page">
        <h2>Absent Deduction Tracker</h2>
        <div class="radio-toggle">
            <label class="radio-label"><input type="radio" name="absentMode" value="normalAbsent" checked> Normal Absent</label>
            <label class="radio-label"><input type="radio" name="absentMode" value="phAbsent"> Absent Adjacent to Public Holiday</label>
        </div>
        <div class="input-group">
            <label for="absentSalary">Basic Monthly Salary (RM)</label>
            <input type="number" id="absentSalary" placeholder="e.g., 2500" min="0">
        </div>
        <div class="input-group">
            <label for="absentDays">Number of Absent Days</label>
            <input type="number" id="absentDays" placeholder="e.g., 1" min="1">
        </div>
        <button class="btn-calc" onclick="calculateAbsent()" style="background-color: #dc3545;">Calculate Deduction</button>
        <div class="result-section" id="absentResultSection" style="background-color: #fff5f5; border: 1px solid #feb2b2;">
            <div class="total-hours-text" id="absentDaysDisplay" style="color: #9b2c2c; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Total Days Deducted: 0 Days</div>
            <h3 style="color: #9b2c2c; font-size: 14px; margin-bottom: 6px; text-transform: uppercase;">Total Salary to Deduct</h3>
            <p class="result-amount" style="color: #9b2c2c;" id="totalAbsentDeduct">RM 0.00</p>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <h2>HR Task Scheduler View</h2>
        
        <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1; min-width: 140px; margin-bottom: 0;">
                    <label for="reminderDate">Event Date</label>
                    <input type="date" id="reminderDate">
                </div>
                <div class="input-group" style="flex: 1; min-width: 110px; margin-bottom: 0;">
                    <label for="reminderTime">Event Time</label>
                    <input type="time" id="reminderTime" value="09:00">
                </div>
                <div class="input-group" style="flex: 2; min-width: 200px; margin-bottom: 0;">
                    <label for="reminderTitle">Task / Event Description Note</label>
                    <input type="text" id="reminderTitle" placeholder="e.g., Final Run (Payroll Data)">
                </div>
            </div>
            <button onclick="addReminder()" style="width: 100%; padding: 10px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 12px; cursor: pointer;">Insert Event to Calendar</button>
        </div>

        <div class="calendar-header">
            <button class="calendar-nav-btn" onclick="changeMonth(-1)">&lt; Prev</button>
            <h3 id="calendarMonthYearTitle">Month Year</h3>
            <button class="calendar-nav-btn" onclick="changeMonth(1)">Next &gt;</button>
        </div>

        <div class="calendar-grid" id="calendarGridContainer"></div>
    </div>

    <div class="app-footer">
        Made in NOEL ETHAN
    </div>
</div>

<script>
    let currentNavDate = new Date(); 
    let remindersArray = JSON.parse(localStorage.getItem('hrReminders')) || [];

    window.onload = function() {
        const todayStr = new Date().toISOString().split('T')[0];
        if(document.getElementById('submissionDate')) document.getElementById('submissionDate').value = todayStr;
        if(document.getElementById('targetLastDay')) document.getElementById('targetLastDay').value = todayStr;
        if(document.getElementById('reminderDate')) document.getElementById('reminderDate').value = todayStr;
        
        renderVisualCalendar();
        
        // --- REALTIME ALERTS POLLING CLOCK ENGINE ---
        checkAndTriggerBotAlerts(); 
        setInterval(checkAndTriggerBotAlerts, 60000); 
    };

    function switchTab(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    function toggleClaimMode() {
        const mode = document.querySelector('input[name="claimMode"]:checked').value;
        const minutesGroup = document.getElementById('otMinutesInputGroup');
        const phGroup = document.getElementById('phDaysInputGroup');
        const labelText = document.getElementById('minutesGroupLabel');

        if (mode === 'minutesOt' || mode === 'negativeOt') {
            minutesGroup.style.display = 'block';
            phGroup.style.display = 'none';
            labelText.innerText = mode === 'minutesOt' ? "Overtime Duration (Minutes Per Day)" : "Negative OT Duration (Minutes Per Day)";
        } else {
            minutesGroup.style.display = 'none';
            phGroup.style.display = 'block';
        }
    }

    function toggleResignMode() {
        const mode = document.querySelector('input[name="resignMode"]:checked').value;
        document.getElementById('standardNoticeDatesGroup').style.display = 'none';
        document.getElementById('noticeDurationGroup').style.display = 'none';
        document.getElementById('lastDayTargetGroup').style.display = 'none';
        document.getElementById('shortNoticeGroup').style.display = 'none';
        document.getElementById('ytdRefundGroup').style.display = 'none';

        if (mode === 'findEnd') {
            document.getElementById('standardNoticeDatesGroup').style.display = 'block';
            document.getElementById('noticeDurationGroup').style.display = 'block';
        } else if (mode === 'findDiff') {
            document.getElementById('standardNoticeDatesGroup').style.display = 'block';
            document.getElementById('lastDayTargetGroup').style.display = 'block';
        } else if (mode === 'shortNotice') {
            document.getElementById('shortNoticeGroup').style.display = 'block';
        } else if (mode === 'ytdRefund') {
            document.getElementById('ytdRefundGroup').style.display = 'block';
        }
    }

    // ================= OT, NEGATIVE OT & PH CLAIM =================
    function addRow() {
        const container = document.getElementById('otRowsContainer');
        const newRow = document.createElement('div');
        newRow.className = 'ot-row';
        newRow.innerHTML = `<input type="number" class="ot-minutes" placeholder="Enter minutes & press Enter" min="0" onkeydown="checkEnter(event)"><button class="btn-remove" onclick="removeRow(this)">X</button>`;
        container.appendChild(newRow);
        newRow.querySelector('.ot-minutes').focus();
    }
    function checkEnter(event) { if (event.key === 'Enter') { event.preventDefault(); addRow(); } }
    function removeRow(button) {
        const row = button.parentElement;
        const container = document.getElementById('otRowsContainer');
        if (container.children.length > 1) row.remove();
        else alert("Keep at least one row active.");
    }

    function calculateClaim() {
        const salary = parseFloat(document.getElementById('basicSalary').value);
        if (isNaN(salary)) { alert("Please enter a valid basic salary."); return; }
        const mode = document.querySelector('input[name="claimMode"]:checked').value;
        const resultSection = document.getElementById('otResultSection');
        let finalPay = 0;

        const ratePerDay = salary / 26;
        const ratePerHour = ratePerDay / 7.5;
        const ratePerMinute = ratePerHour / 60;

        if (mode === 'minutesOt' || mode === 'negativeOt') {
            let totalMinutes = 0;
            document.querySelectorAll('.ot-minutes').forEach(input => { totalMinutes += parseFloat(input.value) || 0; });
            
            if (mode === 'minutesOt') {
                finalPay = ratePerMinute * 1.5 * totalMinutes;
                document.getElementById('claimSummaryText').innerText = `Total OT Time: ${totalMinutes} mins (Multiplier 1.5x Active)`;
                document.getElementById('claimResultTitle').innerText = "Estimated OT Earnings";
                resultSection.style.backgroundColor = "#f0fdf4"; resultSection.style.borderColor = "#bbf7d0";
                document.getElementById('claimResultTitle').style.color = "#166534";
                document.getElementById('totalOt').style.color = "#15803d";
            } else {
                finalPay = ratePerMinute * 1.0 * totalMinutes;
                document.getElementById('claimSummaryText').innerText = `Total Negative OT Time: ${totalMinutes} mins (Rate 1.0x Active)`;
                document.getElementById('claimResultTitle').innerText = "Total Negative OT Deduction";
                resultSection.style.backgroundColor = "#fffbeb"; resultSection.style.borderColor = "#fef3c7";
                document.getElementById('claimResultTitle').style.color = "#92400e";
                document.getElementById('totalOt').style.color = "#b45309";
            }
        } else {
            const phDays = parseInt(document.getElementById('phDaysWorked').value) || 0;
            if(phDays <= 0) { alert("Please enter the number of PH days worked."); return; }
            finalPay = ratePerDay * phDays * 2.0;
            document.getElementById('claimSummaryText').innerText = `Total PH Days Worked: ${phDays} Days (Double Pay Active)`;
            document.getElementById('claimResultTitle').innerText = "Public Holiday Earnings";
            resultSection.style.backgroundColor = "#f0fdf4"; resultSection.style.borderColor = "#bbf7d0";
            document.getElementById('claimResultTitle').style.color = "#166534";
            document.getElementById('totalOt').style.color = "#15803d";
        }
        document.getElementById('totalOt').innerText = "RM " + finalPay.toFixed(2);
        resultSection.style.display = 'block';
    }

    // ================= RESIGNATION, INDEMNITY & LEAVE ENCHASHMENT =================
    function calculateNotice() {
        const mode = document.querySelector('input[name="resignMode"]:checked').value;
        const resultSection = document.getElementById('resignResultSection');
        const resultTitle = document.getElementById('resignResultTitle');
        const resultValue = document.getElementById('resignResultValue');

        if (mode === 'shortNotice') {
            const basic = parseFloat(document.getElementById('shortNoticeSalary').value);
            const days = parseInt(document.getElementById('shortNoticeDays').value);
            if (isNaN(basic) || isNaN(days)) return;
            const indemnityAmount = (basic / 26) * days;
            resultTitle.innerText = "Indemnity Amount Payable (Ganti Rugi):";
            resultValue.innerText = "RM " + indemnityAmount.toFixed(2);
            resultSection.style.backgroundColor = "#fef2f2"; resultSection.style.borderColor = "#fca5a5";
            resultTitle.style.color = "#991b1b"; resultValue.style.color = "#991b1b";
        } else if (mode === 'ytdRefund') {
            const basic = parseFloat(document.getElementById('ytdSalary').value);
            const ytdDays = parseFloat(document.getElementById('ytdDays').value);
            if (isNaN(basic) || isNaN(ytdDays)) return;
            const refundAmount = (basic / 26) * ytdDays;
            resultTitle.innerText = "YTD AL Refund Amount (Leave Encashment):";
            resultValue.innerText = "RM " + refundAmount.toFixed(2);
            resultSection.style.backgroundColor = "#f0fdf4"; resultSection.style.borderColor = "#bbf7d0";
            resultTitle.style.color = "#166534"; resultValue.style.color = "#15803d";
        } else {
            resultSection.style.backgroundColor = "#f0f7ff"; resultSection.style.borderColor = "#bae6fd";
            resultTitle.style.color = "#0369a1"; resultValue.style.color = "#0369a1";
            const submissionDate = new Date(document.getElementById('submissionDate').value);
            if (mode === 'findEnd') {
                const duration = parseInt(document.getElementById('noticeValue').value);
                const unit = document.getElementById('noticeUnit').value;
                let lastWorkingDay = new Date(submissionDate);
                if (unit === 'days') lastWorkingDay.setDate(lastWorkingDay.getDate() + duration);
                else lastWorkingDay.setMonth(lastWorkingDay.getMonth() + duration);
                resultTitle.innerText = "Calculated Last Working Day:";
                resultValue.innerText = lastWorkingDay.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            } else {
                const targetLastDay = new Date(document.getElementById('targetLastDay').value);
                const diffInDays = Math.ceil((targetLastDay - submissionDate) / (1000 * 60 * 60 * 24));
                resultTitle.innerText = "Notice Period Served:";
                resultValue.innerText = `${diffInDays} Days`;
            }
        }
        resultSection.style.display = 'block';
    }

    // ================= ABSENT DEDUCTION =================
    function calculateAbsent() {
        const basic = parseFloat(document.getElementById('absentSalary').value);
        const inputDays = parseInt(document.getElementById('absentDays').value);
        const mode = document.querySelector('input[name="absentMode"]:checked').value;
        if (isNaN(basic) || isNaN(inputDays)) return;
        let totalDays = inputDays + (mode === 'phAbsent' ? 1 : 0);
        const deduction = (basic / 26) * totalDays;
        document.getElementById('absentDaysDisplay').innerText = `Total Days Deducted: ${totalDays} Days`;
        document.getElementById('totalAbsentDeduct').innerText = "RM " + deduction.toFixed(2);
        document.getElementById('absentResultSection').style.display = 'block';
    }

    // ================= HR VISUAL SCHEDULER CALENDAR & BOT WEBHOOK =================
    function changeMonth(direction) {
        currentNavDate.setMonth(currentNavDate.getMonth() + direction);
        renderVisualCalendar();
    }

    function addReminder() {
        const dateVal = document.getElementById('reminderDate').value;
        const timeVal = document.getElementById('reminderTime').value; 
        const textVal = document.getElementById('reminderTitle').value;
        if (!dateVal || !timeVal || !textVal.trim()) return;

        const newEvent = { id: Date.now(), date: dateVal, time: timeVal, message: textVal, alerted: false };
        remindersArray.push(newEvent);
        localStorage.setItem('hrReminders', JSON.stringify(remindersArray));
        
        document.getElementById('reminderTitle').value = '';
        renderVisualCalendar();
        checkAndTriggerBotAlerts(); 
    }

    function removeEvent(id, event) {
        if(event) event.stopPropagation();
        remindersArray = remindersArray.filter(item => item.id !== id);
        localStorage.setItem('hrReminders', JSON.stringify(remindersArray));
        renderVisualCalendar();
    }

    // --- DIKEMAS KINI: PENERIMAAN KAEDAH WEBHOOK FORMDATA ANTI-BLOCKING ---
    function hantarKeBotWhatsApp(message, date, time) {
        const cleanDate = new Date(date).toLocaleDateString('en-MY', { year: 'numeric', month: 'short', day: 'numeric' });
        
        const [hours, minutes] = time.split(':');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedTime = `${hours % 12 || 12}:${minutes} ${ampm}`;
        
        const textMessage = `📢 *HR TASK ALERT SYSTEM*\n\n📅 *Date:* ${cleanDate}\n⏰ *Time:* ${formattedTime}\n📝 *Task To Do:* ${message}\n\n_Generated automatically via Noel Ethan Dashboard Scheduler_`;

        const BOT_TOKEN = "71SME9mMhVBZgB7awkZQ";       
        const GROUP_ID = "HZIfA2IJrdjAzx23WXsZaP";        

        // Menggunakan FormData bagi menyelesaikan isu CORS Policy browser desktop
        const formData = new FormData();
        formData.append('target', GROUP_ID);
        formData.append('message', textMessage);
        formData.append('countryCode', '60'); 

        fetch("https://api.fonnte.com/send", {
            method: 'POST',
            headers: {
                'Authorization': BOT_TOKEN
            },
            body: formData
        })
        .then(response => response.json())
        .then(result => {
            console.log("Fonnte API Webhook Pipeline Out:", result);
        })
        .catch(error => console.error("Webhook gateway configuration error:", error));
    }

    function checkAndTriggerBotAlerts() {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMinutes = String(now.getMinutes()).padStart(2, '0');
        const currentTimeStr = `${currentHours}:${currentMinutes}`;

        let stateUpdated = false;

        remindersArray.forEach(item => {
            if (item.date === todayStr && item.time === currentTimeStr && !item.alerted) {
                item.alerted = true; 
                stateUpdated = true;
                hantarKeBotWhatsApp(item.message, item.date, item.time);
            }
        });

        if (stateUpdated) {
            localStorage.setItem('hrReminders', JSON.stringify(remindersArray));
            renderVisualCalendar();
        }
    }

    function renderVisualCalendar() {
        const container = document.getElementById('calendarGridContainer');
        const titleContainer = document.getElementById('calendarMonthYearTitle');
        container.innerHTML = '';

        const year = currentNavDate.getFullYear();
        const month = currentNavDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        titleContainer.innerText = `${monthNames[month]} ${year}`;

        const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        daysOfWeek.forEach(d => {
            const el = document.createElement('div');
            el.className = 'calendar-day-name';
            el.innerText = d;
            container.appendChild(el);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDaysMonth = new Date(year, month + 1, 0).getDate();
        const totalDaysPrevMonth = new Date(year, month, 0).getDate();
        const todayStr = new Date().toISOString().split('T')[0];

        // Fill Prev Month
        for(let i = firstDayIndex; i > 0; i--) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `<div class="cell-number">${totalDaysPrevMonth - i + 1}</div>`;
            container.appendChild(cell);
        }

        // Current Active Month
        for(let day = 1; day <= totalDaysMonth; day++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            
            const mStr = String(month + 1).padStart(2, '0');
            const dStr = String(day).padStart(2, '0');
            const loopDateStr = `${year}-${mStr}-${dStr}`;

            if(loopDateStr === todayStr) cell.classList.add('today');
            cell.innerHTML = `<div class="cell-number">${day}</div>`;

            const dayEvents = remindersArray.filter(item => item.date === loopDateStr);
            dayEvents.sort((a, b) => a.time.localeCompare(b.time));

            dayEvents.forEach(evt => {
                const tag = document.createElement('div');
                tag.className = 'calendar-event-tag';
                if (evt.alerted) tag.classList.add('triggered'); 
                
                tag.innerHTML = `
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <strong>${evt.time}</strong> ${evt.message}
                    </span>
                    <button class="event-delete-x" onclick="removeEvent(${evt.id}, event)">x</button>
                `;
                cell.appendChild(tag);
            });

            container.appendChild(cell);
        }

        // Next Month Padding
        const totalCells = firstDayIndex + totalDaysMonth;
        const remaining = 42 - totalCells;
        for(let nextDay = 1; nextDay <= remaining; nextDay++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `<div class="cell-number">${nextDay}</div>`;
            container.appendChild(cell);
        }
    }
</script>
