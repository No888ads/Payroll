<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR TERMINAL V9.4: CYBERNETIC PROTOCOL (H&L EDITION)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL HACKER THEME --- */
        :root { --hacker-green: #00FF00; --hacker-bg: #050505; --box-bg: rgba(10, 10, 10, 0.95); --danger: #FF0033; }
        body.god-mode { --hacker-green: #ff003c; --hacker-bg: #0a0000; }
        body { font-family: 'Fira Code', monospace; background-color: var(--hacker-bg); color: var(--hacker-green); margin: 0; padding: 20px; min-height: 100vh; }
        
        #bootScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #050505; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .cyber-panel { background: var(--box-bg); padding: 30px; border: 1px solid rgba(0, 255, 0, 0.1); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .tab-btn.active { border-color: var(--hacker-green) !important; color: var(--hacker-green) !important; }
        .ai-terminal-box { background: #000; border: 1px solid #ff003c; padding: 20px; height: 300px; overflow-y: auto; color: #ff003c; }
        .ai-log { margin-bottom: 10px; }
        #aiCommandInput { background: transparent; border: none; color: #ff003c; width: 100%; font-family: monospace; }
        #aiCommandInput:focus { outline: none; }
    </style>
</head>
<body>

<div id="bootScreen">
    <div style="color:var(--hacker-green)">> INITIALIZING SYSTEM...</div>
</div>

<div class="dashboard-container">
    <div class="cyber-panel sidebar">
        <img src="hl.png" id="secretLogoTrigger" style="width:150px; cursor:pointer;">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('otTab', this)">$ ot_calc</button>
            <button class="tab-btn" id="hiddenGodTabBtn" onclick="switchTab('godModeTab', this)" style="display:block; color:#ff003c;">[ 👁️ GEMINI CORE ]</button>
        </div>
    </div>

    <div class="cyber-panel main-terminal">
        <div id="otTab" class="tab-content active">
            <h2>HR Terminal</h2>
        </div>

        <div id="godModeTab" class="tab-content">
            <h3 style="color:#ff003c;">GEMINI NEURAL CORE</h3>
            <div class="ai-terminal-box" id="aiTerminalWindow">
                <div id="aiTerminalOutput">
                    <div class="ai-log">> SYSTEM READY. AI CONNECTED.</div>
                </div>
            </div>
            <input type="text" id="aiCommandInput" placeholder="> Arahan untuk Gemini..." autocomplete="off">
        </div>
    </div>
</div>

<script>
    // --- GEMINI INTEGRATION ---
    const aiInput = document.getElementById('aiCommandInput');
    const aiOutput = document.getElementById('aiTerminalOutput');
    
    // API KEY BOS DITANAM DI SINI SECARA KEKAL
    const API_KEY = "AQ.Ab8RN6L07Wevx-y5kCiA1I0LtK4CGp962_E3fzdDvhg_ZaFYYA";

    async function sendToGemini(text) {
        aiOutput.innerHTML += `<div class="ai-log">> Processing...</div>`;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            aiOutput.innerHTML += `<div class="ai-log" style="color:#fff;">${reply}</div>`;
        } catch(e) {
            aiOutput.innerHTML += `<div class="ai-log" style="color:red;">Error: ${e.message}</div>`;
        }
    }

    aiInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            let cmd = this.value.trim();
            if(cmd === '') return;
            this.value = '';
            aiOutput.innerHTML += `<div class="ai-log">> ${cmd}</div>`;
            sendToGemini(cmd);
        }
    });

    // --- SETUP ASAL ---
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.getElementById(tabId).classList.add('active');
    }
    document.getElementById('secretLogoTrigger').addEventListener('click', () => { document.body.classList.add('god-mode'); });
</script>
</body>
</html>
